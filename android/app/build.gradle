apply plugin: 'com.android.application'

// Load release signing config from keystore.properties (gitignored).
// See RELEASE.md → "Generate the upload keystore" for the keytool
// command and the expected properties file format. If the file is
// absent (e.g. a debug build on a fresh checkout) we fall through to
// the default debug signing config so `cap run android` keeps working.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = false
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseKeystore = true
}

android {
    namespace = "com.usehisaab.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.usehisaab.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // ProGuard / R8 is disabled because the WebView app surface is
            // small and Capacitor doesn't ship rules for all its plugins.
            // Re-enable + supply rules before a final-perf release if
            // bundle size becomes a concern.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            // If no keystore.properties is present, Gradle falls back to
            // the debug signing config — fine for local testing but the
            // resulting APK/AAB cannot be uploaded to Play. Generate the
            // keystore before running `assembleRelease`/`bundleRelease`.
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Safety net: fail a RELEASE build loudly if the upload keystore is absent,
// instead of silently producing a debug-signed AAB/APK that Play will reject
// (or worse, that looks valid locally). Debug builds (`cap run android`) are
// unaffected. See RELEASE.md sections 1-2 to generate the keystore.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        task.name == 'bundleRelease' || task.name == 'assembleRelease'
    }
    if (buildingRelease && !hasReleaseKeystore) {
        throw new GradleException(
            "Release build requested but android/keystore.properties is missing — " +
            "this would produce a debug-signed artifact Play cannot accept. " +
            "Generate the upload keystore first (see RELEASE.md sections 1-2).")
    }
}

apply from: 'capacitor.build.gradle'

def hasGoogleServicesJson = file('google-services.json').exists()

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Safety net: fail a RELEASE build loudly if google-services.json is absent,
// instead of silently producing an AAB/APK with zero FCM delivery while the
// app is backgrounded or killed (MF-05, docs/audit-2026-09/07-mobile-first.md).
// Mirrors the keystore guard above. Debug builds (`cap run android`) are
// unaffected — only bundleRelease/assembleRelease are blocked. See
// docs/push-notifications-setup.md to obtain the file from Firebase console
// and place it at android/app/google-services.json.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        task.name == 'bundleRelease' || task.name == 'assembleRelease'
    }
    if (buildingRelease && !hasGoogleServicesJson) {
        throw new GradleException(
            "Release build requested but android/app/google-services.json is missing — " +
            "this AAB/APK would ship with zero push notification delivery while the app " +
            "is backgrounded or killed. Get the file from the Firebase console and place " +
            "it at android/app/google-services.json (see docs/push-notifications-setup.md).")
    }
}

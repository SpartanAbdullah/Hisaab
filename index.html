<!doctype html>
<html lang="ur-Latn">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy.

      We allow only what the app actually uses:
      - self            (our own bundle, manifest, sw.js, icons)
      - Supabase        (auth, REST, realtime websockets, storage)
      - Sentry          (crash reporting; safe to leave even when DSN unset)
      - PostHog EU      (opt-in product telemetry; connect-src ONLY. The SDK is
                        bundled from npm and initialised with
                        `disable_external_dependency_loading: true`, so it never
                        injects a remote <script> — script-src stays 'self'.
                        Harmless when VITE_POSTHOG_KEY is unset or consent is
                        declined: nothing connects. See src/lib/telemetry.ts.)
      - Geist font      (self-hosted from /fonts — see public/fonts/ and the
                        @font-face block at the top of src/index.css; no
                        third-party font host needed any more, P2 M2a)
      - data:/blob:     (inline icons, generated blob URLs)
      - 'unsafe-inline' on style-src because Tailwind v4 injects runtime
        CSS via inline <style> tags and Modal/animation utilities use
        inline style attributes. Removing it would require migrating to
        nonces, which Vite doesn't ship out of the box.

      connect-src includes wss:// for Supabase realtime and ws://localhost
      for Vite HMR in dev (harmless in prod since it just won't connect).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://*.ingest.us.sentry.io https://eu.i.posthog.com https://eu-assets.i.posthog.com ws://localhost:* http://localhost:*; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0A0A14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hisaab" />
    <meta name="description" content="Your money, always in sight. Personal finance management for Pakistani expats." />
    <link rel="canonical" href="%VITE_PUBLIC_APP_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hisaab" />
    <meta property="og:title" content="Hisaab - Money Flow Manager" />
    <meta property="og:description" content="Your money, always in sight. Personal finance management for Pakistani expats." />
    <meta property="og:url" content="%VITE_PUBLIC_APP_URL%/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hisaab - Money Flow Manager" />
    <meta name="twitter:description" content="Your money, always in sight. Personal finance management for Pakistani expats." />
    <title>Hisaab - Money Flow Manager</title>
    <!-- Self-hosted Geist (P2 M2a): a single variable-font file covers every
         weight the app uses (400/500/600/700), so there's exactly one file
         to preload — see the @font-face block at the top of src/index.css
         and docs/performance.md for the before/after and the source URL. -->
    <link rel="preload" href="/fonts/geist-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Applies the stored (or default dark) theme class to <html> before first
         paint — no light flash. A blocking external script because the CSP's
         script-src 'self' refuses inline ones. Mirrors src/stores/themeStore.ts. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
